manifestSchemaVersion: 3
appId: inkline
version: 1.0.22
displayName: Inkline
description: "Draw.io diagrams, UML sequence diagrams, and web search."
publisher:
  id: local-dev
  displayName: "Local Dev"
  contact: dev@local-dev.example
contributes:
  skills:
    - name: generate-drawio
      description: When the user wants a draw.io / diagrams.net flowchart, architecture, or process diagram, call generate-drawio with fileName and prompt. OpenAI draws the diagram. For sequence / UML interaction diagrams call generate-sequencediagram.
      appendsTo: system
      content: src/skills/generate-drawio
      timeoutMs: 3000
      failure_mode: skip
    - name: generate-sequencediagram
      description: When the user wants a sequence diagram, UML sequence, request/response timeline, if/else, loop, note, or parallel path, call generate-sequencediagram instead of generate-drawio. It returns both a .drawio file and a SequenceDiagram.org .txt source file.
      appendsTo: system
      content: src/skills/generate-sequencediagram
      timeoutMs: 3000
      failure_mode: skip
    - name: inkline-search
      description: For live web lookup, news, or tra cứu, always call inkline-search (Inkline OpenAI rewrite + search). Never use /search, platform Web Search, webSearch, or web-search.
      appendsTo: system
      content: src/skills/inkline-search
      timeoutMs: 3000
      failure_mode: skip
  tools:
    - name: generate-drawio
      description: OpenAI draws a flowchart from the user's prompt and returns a downloadable .drawio file. Pass fileName and prompt (the user's request in their words). Do not invent nodes or edges. Do not use for UML sequence diagrams — call generate-sequencediagram. Returns fileName, nodeCount, edgeCount.
      route: POST /tools/generate-drawio
      inputSchema: src/schemas/generate-drawio-input.schema.json
      outputSchema: src/schemas/generate-drawio-output.schema.json
      timeoutMs: 30000
      failure_mode: abort
    - name: generate-sequencediagram
      description: Generate a downloadable draw.io sequence diagram and a SequenceDiagram.org .txt source file from participants and messages. Use for UML sequence, request/response, if/else (alt/else), loops, notes, and parallel paths. Pass native JSON arrays, not stringified arrays. Returns fileName (.drawio), txtFileName (.txt), participantCount, and messageCount.
      route: POST /tools/generate-sequencediagram
      inputSchema: src/schemas/generate-sequencediagram-input.schema.json
      outputSchema: src/schemas/generate-sequencediagram-output.schema.json
      timeoutMs: 15000
      failure_mode: abort
    - name: inkline-search
      description: Inkline live web search. Rewrite the query, search with OpenAI, return source URLs only — do not expect a summary. The Sota agent writes the answer. Always prefer this over platform /search, Web Search, webSearch, or web-search. Pass the original user question as query.
      route: POST /tools/inkline-search
      inputSchema: src/schemas/web-search-input.schema.json
      outputSchema: src/schemas/web-search-output.schema.json
      timeoutMs: 30000
      failure_mode: abort
  slashCommands:
    - verb: inksearch
      scope: workspace
      description: Search the live web with Inkline (OpenAI rewrite + sources). Use this instead of /search.
      argumentHint: question
      target:
        kind: tool
        ref: inkline-search
  ui:
    - id: admin-screen
      kind: nativeModule
      surface: page
      slot: admin.workspace.tab
      sectionId: inkline
      label: Inkline
      route: /inkline/*
      module:
        entry: dist/ui/app.js
        export: AdminScreen
        styles: dist/ui/app.css
    - id: generate-drawio-result
      kind: nativeModule
      surface: tool-view
      slot: chat.message.inline.below
      label: Draw.io diagram
      toolNames:
        - generate-drawio
      renderBeforeOutput: true
      topLevelToolRender: true
      module:
        entry: dist/ui/app.js
        export: GenerateDrawioResult
        styles: dist/ui/app.css
    - id: generate-sequencediagram-result
      kind: nativeModule
      surface: tool-view
      slot: chat.message.inline.below
      label: Sequence diagram
      toolNames:
        - generate-sequencediagram
      renderBeforeOutput: true
      topLevelToolRender: true
      module:
        entry: dist/ui/app.js
        export: GenerateSequenceDiagramResult
        styles: dist/ui/app.css
    - id: web-search-result
      kind: nativeModule
      surface: tool-view
      slot: chat.message.inline.below
      label: Inkline search
      toolNames:
        - inkline-search
      renderBeforeOutput: true
      topLevelToolRender: true
      module:
        entry: dist/ui/app.js
        export: WebSearchResult
        styles: dist/ui/app.css
service:
  baseUrl: https://api.viet.it.com
health:
  url: https://api.viet.it.com/health
  intervalSeconds: 60
environments:
  local:
    service:
      baseUrl: http://localhost:8787
    health:
      url: http://localhost:8787/health
platform: ^1.2.0
locales:
  default: en
  files:
    en: src/locales/en.json
